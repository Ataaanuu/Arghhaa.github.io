<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATANU</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="tree-container">

        <!-- ROOT -->
        <div class="node root-node">
            ATANU
        </div>


        <!-- MAIN TREE -->
        <div class="tree">


            <!-- MUSIC -->
            <section class="tree-branch">

                <button class="node branch-node">
                    MUSIC
                </button>

                <div class="children">

                    <a
                        href="YOUR_SPOTIFY_LINK"
                        target="_blank"
                        class="node leaf-node"
                    >
                        SPOTIFY
                    </a>

                    <a
                        href="YOUR_PLAYLIST_LINK"
                        target="_blank"
                        class="node leaf-node"
                    >
                        PLAYLISTS
                    </a>

                </div>

            </section>


            <!-- EDITING -->
            <section class="tree-branch">

                <button class="node branch-node">
                    EDITING
                </button>

                <div class="children">

                    <a
                        href="https://www.blackmagicdesign.com/products/davinciresolve/"
                        target="_blank"
                        class="node leaf-node"
                    >
                        DAVINCI<br>RESOLVE
                    </a>

                    <a
                        href="https://www.adobe.com/products/aftereffects.html"
                        target="_blank"
                        class="node leaf-node"
                    >
                        AFTER<br>EFFECTS
                    </a>

                    <a
                        href="https://www.blender.org/"
                        target="_blank"
                        class="node leaf-node"
                    >
                        BLENDER
                    </a>

                    <a
                        href="https://derivative.ca/"
                        target="_blank"
                        class="node leaf-node"
                    >
                        TOUCH<br>DESIGNER
                    </a>

                </div>

            </section>


            <!-- SOCIALS -->
            <section class="tree-branch">

                <button class="node branch-node">
                    SOCIALS
                </button>

                <div class="children">

                    <a
                        href="YOUR_INSTAGRAM_LINK"
                        target="_blank"
                        class="node leaf-node"
                    >
                        INSTAGRAM
                    </a>

                    <a
                        href="YOUR_REDDIT_LINK"
                        target="_blank"
                        class="node leaf-node"
                    >
                        REDDIT
                    </a>

                    <a
                        href="YOUR_GITHUB_LINK"
                        target="_blank"
                        class="node leaf-node"
                    >
                        GITHUB
                    </a>

                </div>

            </section>


            <!-- PROJECTS -->
            <section class="tree-branch">

                <button class="node branch-node">
                    PROJECTS
                </button>

                <div class="children">

                    <a
                        href="YOUR_COLLAGE_LINK"
                        target="_blank"
                        class="node leaf-node"
                    >
                        COLLAGE<br>ART
                    </a>

                    <a
                        href="YOUR_EXPERIMENTS_LINK"
                        target="_blank"
                        class="node leaf-node"
                    >
                        EXPERIMENTS
                    </a>

                </div>

            </section>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
