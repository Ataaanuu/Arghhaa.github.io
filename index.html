<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Arghhhaa</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        body {
            padding: 18px 18px 40px 18px;
            font-family: "Courier New", Courier, monospace;
        }

        .tree {
            margin: 0;
            padding: 0;

            font-family: "Courier New", Courier, monospace;

            font-size: 22px;
            line-height: 1.52;

            white-space: pre;

            font-weight: 400;
        }

        /* NAME */

        .name {
            color: #111111;
            font-weight: 700;
        }

        /* FOLDERS */

        .folder {
            color: #0000aa;
            text-decoration: none;
        }

        .folder:hover {
            text-decoration: underline;
        }

        /* FILES */

        .file {
            color: #3f7f3f;
            text-decoration: none;
        }

        .file:hover {
            text-decoration: underline;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 16px 18px 35px 18px;
            }

            .tree {
                font-size: 20px;
                line-height: 1.53;
            }

        }

    </style>

</head>


<body>
