<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atanu's Tree</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>my little corner of the internet</h1>
    <p class="subtitle">click a node to explore</p>

    <div class="tree">

        <!-- ROOT -->
        <div class="root">
            <div class="node main-node">
                ATANU
            </div>
        </div>

        <!-- BRANCHES -->
        <div class="branches">

            <!-- SPOTIFY -->
            <div class="branch">

                <div class="node category">
                    SPOTIFY
                </div>

                <div class="children">

                    <a href="https://open.spotify.com/user/31lkaknhadm5e2osumpsjdw7fynq?si=14828eda0a5444fb"
                       target="_blank"
                       class="node small">

                        PROFILE

                    </a>

                    <a href="YOUR_PLAYLIST_LINK"
                       target="_blank"
                       class="node small">

                        PLAYLIST

                    </a>

                </div>

            </div>


            <!-- EDITING -->
            <div class="branch">

                <div class="node category">
                    EDITING
                </div>

                <div class="children">

                    <a href="https://www.blackmagicdesign.com/products/davinciresolve/"
                       target="_blank"
                       class="node small">

                        DAVINCI

                    </a>

                    <a href="https://www.blender.org/"
                       target="_blank"
                       class="node small">

                        BLENDER

                    </a>

                    <a href="https://www.adobe.com/products/aftereffects.html"
                       target="_blank"
                       class="node small">

                        AFTER FX

                    </a>

                    <a href="https://derivative.ca/"
                       target="_blank"
                       class="node small">

                        TOUCH
                        DESIGNER

                    </a>

                </div>

            </div>


            <!-- SOCIALS -->
            <div class="branch">

                <div class="node category">
                    SOCIALS
                </div>

                <div class="children">

                    <a href="YOUR_INSTAGRAM_LINK"
                       target="_blank"
                       class="node small">

                        INSTAGRAM

                    </a>

                    <a href="YOUR_REDDIT_LINK"
                       target="_blank"
                       class="node small">

                        REDDIT

                    </a>

                    <a href="YOUR_GITHUB_LINK"
                       target="_blank"
                       class="node small">

                        GITHUB

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
